<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转 GIF 工具 (终极版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 gif.js 主库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <!-- 引入 heic2any 用于转换 HEIC 格式 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.3/heic2any.min.js"></script>
    <!-- 引入 libwebp-js 用于转换 WebP 格式 -->
    <script src="https://cdn.jsdelivr.net/npm/libwebp-js/dist/libwebp.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900 dark:text-white">图片转 GIF 在线工具</h1>
            <p class="text-gray-600 dark:text-gray-400 mt-2">将 PNG, JPG, HEIC, 或 WEBP 图片拖拽到下方区域即可自动转换。</p>
        </div>

        <div id="drop-zone" class="border-4 border-dashed border-gray-300 dark:border-gray-600 rounded-2xl p-8 text-center cursor-pointer transition-all duration-300 hover:border-blue-500 hover:bg-gray-50 dark:hover:bg-gray-800">
            <div class="flex flex-col items-center justify-center space-y-4">
                <svg class="w-16 h-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-4-4V7a4 4 0 014-4h10a4 4 0 014 4v5a4 4 0 01-4 4h-3l-4 4z"></path></svg>
                <p class="text-lg font-semibold">将文件拖拽到这里</p>
                <p class="text-sm text-gray-500">或者 <span class="text-blue-500 font-medium">点击选择文件</span></p>
            </div>
            <input type="file" id="file-input" class="hidden" accept="image/png,image/jpeg,image/heic,image/webp">
        </div>

        <div id="result-container" class="mt-8 text-center hidden">
            <div id="loader" class="flex items-center justify-center space-x-2">
                <div class="w-4 h-4 rounded-full bg-blue-500 animate-pulse"></div>
                <div class="w-4 h-4 rounded-full bg-blue-500 animate-pulse [animation-delay:0.2s]"></div>
                <div class="w-4 h-4 rounded-full bg-blue-500 animate-pulse [animation-delay:0.4s]"></div>
                <span class="ml-3 font-medium">正在努力转换中...</span>
            </div>

            <div id="output" class="hidden">
                 <h2 class="text-2xl font-bold mb-4">转换完成！</h2>
                <img id="gif-preview" class="max-w-full mx-auto rounded-lg shadow-lg mb-6" alt="转换后的GIF">
                <div class="flex justify-center items-center space-x-4">
                    <a id="download-btn" href="#" download="converted.gif" class="inline-block bg-blue-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors duration-300">
                        下载 GIF
                    </a>
                    <button id="copy-btn" class="inline-block bg-green-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-green-700 transition-colors duration-300">
                        复制到剪贴板
                    </button>
                </div>
            </div>

            <div id="error-message" class="hidden text-red-500 font-medium bg-red-100 dark:bg-red-900/50 p-4 rounded-lg">
            </div>
        </div>
    </div>

    <script src="/p/image-to-gif-tool/script.js"></script>
</body>
</html>
