<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 预览与自定义拆分工具</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="/p/pdf-split-tool/styles.css">
</head>
<body>

    <h2>📄 PDF 预览与自定义拆分工具</h2>

    <div class="container">
        <div class="left-panel">
            <div class="control-group">
                <label for="pdf-upload">1. 选择 PDF 文件</label>
                <input type="file" id="pdf-upload" accept="application/pdf">
                <div class="info-text" id="page-info">当前未加载文件</div>
            </div>

            <div class="control-group">
                <label for="ranges-input">2. 输入拆分范围 (每行生成一个新文件)</label>
                <textarea id="ranges-input" placeholder="例如：
1-3
4,5
6-10, 12"></textarea>
                <div class="info-text">
                    <strong>规则提示：</strong><br>
                    • 每写一行，就会导出一个独立的 PDF。<br>
                    • 支持连字符（如 <code>1-3</code> 表示第 1 到 3 页）。<br>
                    • 支持逗号（如 <code>1, 4, 5</code> 表示第 1、4、5 页）。<br>
                    • 可组合使用（如 <code>1-3, 5, 7-9</code>）。
                </div>
            </div>

            <button id="split-btn" disabled>拆分并导出</button>
            <div class="status" id="status-msg"></div>
        </div>

        <div class="right-panel">
            <label>PDF 预览</label>
            <iframe id="pdf-preview" src=""></iframe>
        </div>
    </div>

    <script src="/p/pdf-split-tool/script.js"></script>
</body>
</html>
