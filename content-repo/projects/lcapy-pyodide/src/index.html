<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lcapy in Pyodide (Final Fix)</title>
    <!-- 1. 直接引入 Pyodide 的 JS 文件 -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

<body>
